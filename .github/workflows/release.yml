name: Release Snapshots

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[frameworks,host,linux_x64,generate]"
          pip install paxml

      - name: Generate Snapshots
        run: |
          python generate_all_snapshots.py

      - name: Build Wheel
        run: |
          python -m build

      - name: Release and Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            src/ml_framework_snapshots/snapshots/*.json
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
