name: Release Snapshots

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create required directories and set permissions (Linux)
        run: |
          sudo mkdir -p /Users/samuel/repos
          sudo chown -R $USER /Users
        if: runner.os == 'Linux'

      - name: Create required directories (macOS)
        run: |
          sudo mkdir -p /Users/samuel/repos
          sudo chown -R $USER /Users/samuel
        if: runner.os == 'macOS'

      - name: Checkout ml-switcheroo-ir
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/ml-switcheroo-ir
          path: ml-switcheroo-ir

      - name: Move ml-switcheroo-ir
        run: mv ml-switcheroo-ir /Users/samuel/repos/ml-switcheroo-ir

      - name: Setup GitHub Release
        id: setup_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$GITHUB_REF_NAME" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Release $GITHUB_REF_NAME" --notes "Automated release $GITHUB_REF_NAME"
            gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' > current_assets.txt || touch current_assets.txt
          else
            touch current_assets.txt
          fi

      - name: Set up Python 3.10 (for paxml)
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
        if: runner.os == 'Linux'

      - name: Install dependencies and generate Paxml snapshot
        if: runner.os == 'Linux'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m pip install --upgrade pip
          python3 -m venv venv-3-10
          venv-3-10/bin/python3 -m pip install -U setuptools wheel pip
          venv-3-10/bin/python3 -m pip install '.[generate]'
          venv-3-10/bin/python3 -m pip uninstall -y jaxlib jax optax
          venv-3-10/bin/python3 -m pip install paxml "jaxlib==0.4.26"

          # Check version
          ver=$(venv-3-10/bin/python3 -c "import sys, os; sys.path.insert(0, 'src'); from ml_framework_snapshots.api import get_pkg_version; v = get_pkg_version('pax'); print(v.replace('+','_').replace(' ','_'))" || echo "unknown")
          filename="pax_v${ver}.json"

          if grep -Fq "$filename" current_assets.txt; then
            echo "Snapshot for pax version $ver already exists. Skipping."
          else
            venv-3-10/bin/python3 scripts/generate_all_snapshots.py pax
            if [ -n "$GITHUB_REF_NAME" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
              gh release upload "$GITHUB_REF_NAME" "src/ml_framework_snapshots/snapshots/$filename" --clobber
            fi
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Set up Python 3.12 (for other frameworks)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate remaining snapshots
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          frameworks="torch jax tensorflow keras mlx numpy cupy dask flax_nnx deepspeed optax_shim orbax_checkpoint huggingface triton sklearn onnxruntime"
          for fw in $frameworks; do
            echo "::group::Generate snapshot for $fw"

            if [ "$fw" = "mlx" ] && [ "$RUNNER_OS" != "macOS" ]; then
              echo "Skipping mlx on non-macOS"
              echo "::endgroup::"
              continue
            fi

            if [ "$fw" != "mlx" ] && [ "$RUNNER_OS" == "macOS" ]; then
              echo "Skipping $fw on macOS"
              echo "::endgroup::"
              continue
            fi

            uv venv "venv-$fw" --python 3.12
            uv pip install -p "venv-$fw" '.[generate]'

            case $fw in
              torch) PKGS="torch --index-url https://download.pytorch.org/whl/cpu" ;;
              jax) PKGS="jax[cpu]" ;;
              tensorflow) PKGS="tensorflow-cpu" ;;
              keras) PKGS="keras" ;;
              mlx) PKGS="mlx" ;;
              numpy) PKGS="numpy<2.0.0" ;;
              cupy) PKGS="cupy-cuda12x" ;;
              dask) PKGS="dask" ;;
              flax_nnx) PKGS="flax jax[cpu]" ;;
              deepspeed) PKGS="deepspeed torch --index-url https://download.pytorch.org/whl/cpu" ;;
              optax_shim) PKGS="optax jax[cpu]" ;;
              orbax_checkpoint) PKGS="orbax-checkpoint jax[cpu]" ;;
              huggingface) PKGS="transformers" ;;
              triton) PKGS="triton" ;;
              sklearn) PKGS="scikit-learn" ;;
              onnxruntime) PKGS="onnxruntime" ;;
              *) PKGS="" ;;
            esac

            if [ -n "$PKGS" ]; then
              uv pip install -p "venv-$fw" $PKGS
            fi

            ver=$("venv-$fw/bin/python3" -c "import sys, os; sys.path.insert(0, 'src'); from ml_framework_snapshots.api import get_pkg_version; v = get_pkg_version('$fw'); print(v.replace('+','_').replace(' ','_'))" || echo "unknown")
            filename="${fw}_v${ver}.json"

            if grep -Fq "$filename" current_assets.txt; then
              echo "Snapshot for $fw version $ver already exists. Skipping."
            else
              "venv-$fw/bin/python3" scripts/generate_all_snapshots.py $fw

              if [ -n "$GITHUB_REF_NAME" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
                if [ -f "src/ml_framework_snapshots/snapshots/$filename" ]; then
                  gh release upload "$GITHUB_REF_NAME" "src/ml_framework_snapshots/snapshots/$filename" --clobber
                else
                  echo "Warning: Expected snapshot file src/ml_framework_snapshots/snapshots/$filename was not generated."
                fi
              fi
            fi

            echo "::endgroup::"
          done

      - name: Build and Upload Wheel
        if: runner.os == 'Linux'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv venv venv-build --python 3.12
          uv pip install -p venv-build build
          venv-build/bin/python3 -m build
          if [ -n "$GITHUB_REF_NAME" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          fi
