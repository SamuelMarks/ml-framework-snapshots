name: Release Snapshots

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create required directories and set permissions
        run: |
          sudo mkdir -p /Users/samuel/repos
          sudo chown -R $(whoami) /Users

      - name: Checkout ml-switcheroo-ir
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/ml-switcheroo-ir
          path: ml-switcheroo-ir

      - name: Move ml-switcheroo-ir
        run: mv ml-switcheroo-ir /Users/samuel/repos/ml-switcheroo-ir

      - name: Set up Python 3.10 (for paxml)
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies and generate Paxml snapshot
        run: |
          python3 -m pip install --upgrade pip
          python3 -m venv venv-3-10
          venv-3-10/bin/python3 -m pip install -U setuptools wheel pip
          venv-3-10/bin/python3 -m pip install '.[generate]'
          venv-3-10/bin/python3 -m pip uninstall -y jaxlib jax optax
          venv-3-10/bin/python3 -m pip install paxml "jaxlib==0.4.26"
          venv-3-10/bin/python3 scripts/generate_all_snapshots.py pax

      - name: Set up Python 3.12 (for other frameworks)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies for other frameworks
        run: |
          python3 -m pip install --upgrade pip
          python3 -m venv venv-3-12
          venv-3-12/bin/python3 -m pip install -U setuptools wheel pip
          venv-3-12/bin/python3 -m pip install '.[frameworks,host,linux_x64,generate]' build

      - name: Generate remaining snapshots
        run: |
          venv-3-12/bin/python3 scripts/generate_all_snapshots.py torch jax tensorflow keras mlx numpy cupy dask flax_nnx deepspeed optax_shim orbax_checkpoint huggingface triton sklearn onnxruntime

      - name: Build Wheel
        run: |
          venv-3-12/bin/python3 -m build

      - name: Release and Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            src/ml_framework_snapshots/snapshots/*.json
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
