name: Release Snapshots

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish to (defaults to tag ref or dry-run if omitted)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create required directories and set permissions (Linux)
        run: |
          sudo mkdir -p /Users/samuel/repos
          sudo chown -R $USER /Users
        if: runner.os == 'Linux'

      - name: Create required directories (macOS)
        run: |
          sudo mkdir -p /Users/samuel/repos
          sudo chown -R $USER /Users/samuel
        if: runner.os == 'macOS'

      - name: Checkout ml-switcheroo-ir
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/ml-switcheroo-ir
          path: ml-switcheroo-ir

      - name: Stage ml-switcheroo-ir
        run: |
          cp -r ml-switcheroo-ir /Users/samuel/repos/ml-switcheroo-ir 2>/dev/null || mv ml-switcheroo-ir /Users/samuel/repos/ml-switcheroo-ir

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Set up Python 3.10 (for paxml)
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
        if: runner.os == 'Linux'

      - name: Install dependencies and generate Paxml snapshot
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install --upgrade pip
          python3 -m venv venv-3-10
          venv-3-10/bin/python3 -m pip install -U setuptools wheel pip
          venv-3-10/bin/python3 -m pip install -e /Users/samuel/repos/ml-switcheroo-ir
          venv-3-10/bin/python3 -m pip install '.[generate]'
          venv-3-10/bin/python3 -m pip uninstall -y jaxlib jax optax || true
          venv-3-10/bin/python3 -m pip install paxml "jaxlib==0.4.26"

          mkdir -p src/ml_framework_snapshots/snapshots
          venv-3-10/bin/python3 scripts/generate_all_snapshots.py pax || true

      - name: Set up Python 3.12 (for other frameworks)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate stablehlo snapshot
        run: |
          mkdir -p src/ml_framework_snapshots/snapshots
          if [ ! -f "src/ml_framework_snapshots/snapshots/stablehlo_v1.0.0.json" ]; then
            python3 src/ml_framework_snapshots/tools/build_stablehlo_snapshot.py
          fi

      - name: Generate remaining snapshots
        run: |
          frameworks="torch jax tensorflow keras mlx numpy cupy dask flax_nnx deepspeed optax_shim orbax_checkpoint huggingface diffusers tokenizers triton sklearn onnxruntime nvidia_sass html_dsl latex_dsl tikz maxtext mlir amd_rdna"

          mkdir -p src/ml_framework_snapshots/snapshots

          for fw in $frameworks; do
            if [ "$fw" = "mlx" ] && [ "$RUNNER_OS" != "macOS" ]; then continue; fi
            if [ "$fw" != "mlx" ] && [ "$RUNNER_OS" == "macOS" ]; then continue; fi

            echo "=== Processing $fw ==="
            uv venv "venv-$fw" --python 3.12
            uv pip install -p "venv-$fw" -e /Users/samuel/repos/ml-switcheroo-ir
            uv pip install -p "venv-$fw" '.[generate]'

            case $fw in
              torch) PKGS="torch --extra-index-url https://download.pytorch.org/whl/cpu" ;;
              jax) PKGS="jax[cpu]" ;;
              tensorflow)
                if [ "$RUNNER_OS" == "macOS" ]; then
                  PKGS="tensorflow-macos"
                else
                  PKGS="tensorflow-cpu"
                fi
                ;;
              keras) PKGS="keras" ;;
              mlx) PKGS="mlx" ;;
              numpy) PKGS="numpy<2.0.0" ;;
              cupy) PKGS="cupy-cuda12x" ;;
              dask) PKGS="dask" ;;
              flax_nnx) PKGS="flax jax[cpu]" ;;
              deepspeed) PKGS="deepspeed torch --extra-index-url https://download.pytorch.org/whl/cpu" ;;
              optax_shim) PKGS="optax jax[cpu]" ;;
              orbax_checkpoint) PKGS="orbax-checkpoint jax[cpu]" ;;
              huggingface) PKGS="transformers" ;;
              diffusers) PKGS="diffusers torch --extra-index-url https://download.pytorch.org/whl/cpu" ;;
              tokenizers) PKGS="tokenizers" ;;
              triton) PKGS="triton" ;;
              sklearn) PKGS="scikit-learn" ;;
              onnxruntime) PKGS="onnxruntime" ;;
              maxtext) PKGS="maxtext" ;;
              mlir) PKGS="jaxlib" ;;
              *) PKGS="" ;;
            esac

            if [ -n "$PKGS" ]; then
              uv pip install -p "venv-$fw" $PKGS || true
            fi

            "venv-$fw/bin/python3" scripts/generate_all_snapshots.py $fw || true
            echo "Finished $fw"
          done

      - name: Upload snapshot artifacts
        uses: actions/upload-artifact@v7
        with:
          name: snapshots-${{ matrix.os }}
          path: src/ml_framework_snapshots/snapshots/*.json
          if-no-files-found: warn

  build-wheel:
    needs: build-and-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Checkout ml-switcheroo-ir
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/ml-switcheroo-ir
          path: ml-switcheroo-ir

      - name: Create required directories and set permissions
        run: |
          sudo mkdir -p /Users/samuel/repos
          sudo chown -R $USER /Users
          cp -r ml-switcheroo-ir /Users/samuel/repos/ml-switcheroo-ir 2>/dev/null || mv ml-switcheroo-ir /Users/samuel/repos/ml-switcheroo-ir

      - name: Download all snapshot artifacts
        uses: actions/download-artifact@v8
        with:
          path: downloaded_snapshots
          merge-multiple: true

      - name: Consolidate snapshots into package
        run: |
          mkdir -p src/ml_framework_snapshots/snapshots
          if [ -d downloaded_snapshots ]; then
            cp -f downloaded_snapshots/*.json src/ml_framework_snapshots/snapshots/ || true
          fi
          echo "Bundled snapshots:"
          ls -la src/ml_framework_snapshots/snapshots/

      - name: Determine Release Tag
        id: tag_check
        run: |
          TARGET_TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TARGET_TAG" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TARGET_TAG="$GITHUB_REF_NAME"
          fi
          echo "TARGET_TAG=$TARGET_TAG" >> $GITHUB_ENV
          echo "Target tag is: $TARGET_TAG"

      - name: Create GitHub Release and upload snapshot JSONs
        if: env.TARGET_TAG != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Guarantee zero database files in snapshots directory
          rm -f src/ml_framework_snapshots/snapshots/*.db* src/ml_framework_snapshots/snapshots/*.sqlite* || true
          gh release view "$TARGET_TAG" >/dev/null 2>&1 || gh release create "$TARGET_TAG" --title "Release $TARGET_TAG" --notes "Automated release $TARGET_TAG" || true
          if ls src/ml_framework_snapshots/snapshots/*.json 1> /dev/null 2>&1; then
            cd src/ml_framework_snapshots/snapshots
            sha256sum *.json > checksums.txt 2>/dev/null || shasum -a 256 *.json > checksums.txt
            gh release upload "$TARGET_TAG" checksums.txt --clobber
            cd -
            gh release upload "$TARGET_TAG" src/ml_framework_snapshots/snapshots/*.json --clobber
          fi
          for extra_json in src/ml_framework_snapshots/frameworks/*_exhaustive.json src/ml_framework_snapshots/concept_map.json; do
            if [ -f "$extra_json" ]; then
              gh release upload "$TARGET_TAG" "$extra_json" --clobber || true
            fi
          done

      - name: Build Wheel and Sdist
        run: |
          uv venv venv-build --python 3.12
          uv pip install -p venv-build -e /Users/samuel/repos/ml-switcheroo-ir
          uv pip install -p venv-build build
          venv-build/bin/python3 -m build
          python3 -c "
          import zipfile, glob, sys
          for whl in glob.glob('dist/*.whl'):
              with zipfile.ZipFile(whl, 'r') as zf:
                  for name in zf.namelist():
                      if name.endswith(('.db', '.sqlite', '.sqlite3', '.db-wal', '.db-journal', '.db-shm', '.sqlite-journal')):
                          sys.exit(f'Found prohibited database file in {whl}: {name}')
          print('Verified dist artifacts contain 0 database files.')
          "

      - name: Verify Wheel Contents and Offline Grounding
        run: |
          echo "=== Wheel zip contents ==="
          python3 -m zipfile -l dist/*.whl | grep "ml_framework_snapshots/snapshots" || true

          echo "=== Testing offline installation and CLI ==="
          uv venv venv-offline --python 3.12
          uv pip install -p venv-offline -e /Users/samuel/repos/ml-switcheroo-ir
          uv pip install -p venv-offline --no-index --find-links=dist ml_framework_snapshots
          venv-offline/bin/ml_framework_snapshots list-snapshots

      - name: Upload Wheel to GitHub Release
        if: env.TARGET_TAG != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TARGET_TAG" dist/* --clobber
